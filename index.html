<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تغییر اندازه عکس</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 1.2rem; margin: 0 0 8px; }
  p { color: #aaa; font-size: 0.9rem; line-height: 1.8; margin: 0 0 20px; }
  label {
    display: block;
    padding: 36px 16px;
    border: 2px dashed #444;
    border-radius: 10px;
    cursor: pointer;
  }
  input { display: none; }
  #result { margin-top: 24px; display: none; }
  #preview {
    width: 130px;
    height: 150px;
    border: 1px solid #444;
    image-rendering: auto;
  }
  #info { margin: 12px 0; font-size: 0.9rem; }
  a.btn {
    display: inline-block;
    padding: 10px 28px;
    background: #0a3fd1;
    color: #fff;
    border-radius: 24px;
    text-decoration: none;
  }
  #error { color: #ff7b7b; margin-top: 16px; display: none; }
</style>
</head>
<body>
<main>
  <h1>تغییر ابعاد و اندازه عکس برای ثبت‌نام</h1>
  <p>خروجی دقیقا 130×150 پیکسل و کمتر از 21 کیلوبایت.<br>عکس روی گوشی خودت پردازش شده و جایی آپلود نمی‌شه.</p>
  <label for="file">انتخاب عکس</label>
  <input id="file" type="file" accept="image/*">
  <div id="result">
    <img id="preview" alt="">
    <div id="info"></div>
    <a id="download" class="btn" download="photo.jpg">دانلود عکس</a>
  </div>
  <div id="error"></div>
</main>
<script>
const W = 130;
const H = 150;
const MAX_BYTES = 21 * 1024 - 512;

const fileInput = document.getElementById("file");
const result = document.getElementById("result");
const preview = document.getElementById("preview");
const info = document.getElementById("info");
const download = document.getElementById("download");
const error = document.getElementById("error");

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("load"));
    };
    img.src = url;
  });
}

function toBlob(canvas, quality) {
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
}

function render(img) {
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  const scale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const w = img.naturalWidth * scale;
  const h = img.naturalHeight * scale;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  return canvas;
}

async function bestBlob(canvas) {
  let lo = 1;
  let hi = 100;
  let best = null;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    const blob = await toBlob(canvas, mid / 100);
    if (blob && blob.size <= MAX_BYTES) {
      best = blob;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  return best;
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  error.style.display = "none";
  result.style.display = "none";
  if (!file) return;
  try {
    const img = await loadImage(file);
    const blob = await bestBlob(render(img));
    if (!blob) throw new Error("size");
    const url = URL.createObjectURL(blob);
    preview.src = url;
    download.href = url;
    info.textContent = W + "×" + H + " — " + (blob.size / 1024).toFixed(2) + " KB";
    result.style.display = "block";
  } catch (e) {
    error.textContent = "پردازش عکس ناموفق بود. یک فایل عکس دیگه امتحان کن.";
    error.style.display = "block";
  }
});
</script>
</body>
</html>
